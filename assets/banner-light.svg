<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="t d">
  <title id="t">Java, Spring, TDD</title>
  <desc id="d">A hexagon with a passing test at its core, surrounded by adapters, beside the text: Java and Spring, built test-first.</desc>
  <defs>
    <radialGradient id="glow" cx="0.775" cy="0.500" r="0.42">
